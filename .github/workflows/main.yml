name: Build APK Dulz PC Launcher 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cari dan Extract ZIP Project
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          mkdir project
          unzip -q "$ZIP" -d project

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project ditemukan di: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== ISI PROJECT ==="
          ls -la

          if [ ! -d "app" ]; then
            echo "Folder app tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "settings.gradle tidak ditemukan!"
            exit 1
          fi

          echo "Struktur Android OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: project
        run: |
          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          cd "$PROJECT_DIR"

          echo "Building project:"
          pwd

          gradle assembleDebug --no-daemon --stacktrace

      - name: Cari APK
        run: |
          APK=$(find project -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan!"
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

          cp "$APK" ./Dulz-PC-Launcher-2026.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dulz-PC-Launcher-2026
          path: Dulz-PC-Launcher-2026.apk
          if-no-files-found: error
