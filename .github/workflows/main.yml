name: Build APK Dulz PC Launcher 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ROOT PROJECT: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Folder app tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT ANDROID DITEMUKAN"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          rm -rf /opt/gradle
          mkdir -p /opt/gradle

          unzip -q /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          /opt/gradle/gradle-8.7/bin/gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILD DULZ PC LAUNCHER 2026"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find project -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "======================================"
          echo "APK BERHASIL DIBUAT"
          echo "======================================"

          ls -lh "$APK"

          cp "$APK" "Dulz-PC-Launcher-2026.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dulz-PC-Launcher-2026-APK
          path: Dulz-PC-Launcher-2026.apk
          if-no-files-found: error
